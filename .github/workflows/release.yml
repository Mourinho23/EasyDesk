name: Build and publish installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach installers to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            command: dist:win
            extra_args: ""
            artifact: windows
            files: release/EasyDesk-Setup-*.exe
          - platform: macOS Intel
            runner: macos-latest
            command: dist:mac
            extra_args: --x64
            artifact: macos-x64
            files: release/*-x64.dmg
          - platform: macOS Apple Silicon
            runner: macos-latest
            command: dist:mac
            extra_args: --arm64
            artifact: macos-arm64
            files: release/*-arm64.dmg
          - platform: Linux
            runner: ubuntu-latest
            command: dist:linux
            extra_args: ""
            artifact: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/*.rpm

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        if: matrix.platform == 'Windows'
        with:
          dotnet-version: 8.0.x
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) { console.error('Expected tag ' + expected); process.exit(1); }"
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }} -- --publish never ${{ matrix.extra_args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --title "EasyDesk $RELEASE_TAG" \
              --generate-notes
          fi
          find release-assets -type f -print0 | \
            xargs -0 gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" --clobber
