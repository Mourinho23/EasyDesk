<svg xmlns="http://www.w3.org/2000/svg" width="680" height="180" viewBox="0 0 680 180" fill="none">
  <defs>
    <!-- Mark Gradients -->
    <linearGradient id="lhdFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="lhdBarTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="lhdBarMidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="lhdBarBotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="lhdDeskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <filter id="lhdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(16, 14) scale(0.32)" filter="url(#lhdGlow)">
    <!-- Monitor Outer Bezel -->
    <rect x="76" y="68" width="360" height="268" rx="48" stroke="url(#lhdFrameGrad)" stroke-width="22" stroke-linecap="round" fill="none" />

    <!-- Stand Stem -->
    <path d="M236 338 L224 402 H288 L276 338 Z" fill="url(#lhdFrameGrad)" opacity="0.95" />

    <!-- Workstation Desk Base -->
    <rect x="156" y="402" width="200" height="26" rx="13" fill="url(#lhdDeskGrad)" />

    <!-- Stylized 'E' Telemetry Structure -->
    <rect x="138" y="126" width="26" height="152" rx="13" fill="url(#lhdFrameGrad)" />
    <rect x="138" y="126" width="210" height="26" rx="13" fill="url(#lhdBarTopGrad)" />
    <rect x="138" y="189" width="140" height="26" rx="13" fill="url(#lhdBarMidGrad)" />
    <circle cx="316" cy="202" r="13" fill="#34D399" />
    <rect x="138" y="252" width="180" height="26" rx="13" fill="url(#lhdBarBotGrad)" />

    <!-- Status dot -->
    <circle cx="388" cy="116" r="8" fill="#34D399" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(196, 0)">
    <!-- Main Logotype: easy desk -->
    <text x="0" y="98" font-family="'Space Grotesk', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="64" letter-spacing="-1.5">
      <tspan font-weight="600" fill="#FFFFFF">easy</tspan><tspan font-weight="800" fill="#818CF8">desk</tspan>
    </text>

    <!-- Telemetry Live Badge -->
    <rect x="312" y="58" width="58" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#059669" stroke-width="1" />
    <circle cx="324" cy="69" r="4" fill="#34D399" />
    <text x="333" y="74" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="0.5">LIVE</text>

    <!-- Subtitle / Application Category -->
    <text x="2" y="132" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3.2">
      MONITORIZAÇÃO DO SISTEMA
    </text>
  </g>
</svg>
